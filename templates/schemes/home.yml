title: Home
default: false
type: listing
children:
    templates: [section]
    reverse: true
    sortable: true
fields:
    published:
        type: checkbox
        default: true
        label: '{{pages.status.published}}'
    routable:
        type: checkbox
        default: true
        label: '{{pages.status.routable}}'
    visible:
        type: checkbox
        default: true
        label: '{{pages.page.visible}}'
    cacheable:
        type: checkbox
        default: true
        label: '{{pages.page.cacheable}}'
